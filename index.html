<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cabina AT-802 · AURAV</title>
<style>
  :root { --tinta: #082440; --acento: #29b6f6; --chaleco: #c8e63a; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #082440; font-family: Arial, Helvetica, sans-serif; }
  [hidden] { display: none !important; }
  #barra { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 8px; align-items: center; padding: 10px 14px; color: #fff; flex-wrap: wrap;
    background: linear-gradient(rgba(8,36,64,.8), rgba(8,36,64,0)); pointer-events: none; }
  #barra > * { pointer-events: auto; }
  #barra .sep { flex: 1; }
  #fase { color: var(--chaleco); font-weight: bold; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 8px 12px; cursor: pointer; background: var(--acento); color: var(--tinta); font-weight: bold; }
  .chico { background: rgba(255,255,255,.18); color: #fff; font-size: 13px; }
  #cargando { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; font-size: 18px; z-index: 5; background: #082440; }
  #ayuda { position: fixed; left: 12px; bottom: 12px; color: #fff; background: rgba(8,36,64,.6); padding: 4px 10px; border-radius: 8px; font-size: 11px; }
  #hud { position: fixed; right: 12px; bottom: 12px; color: #fff; background: rgba(8,36,64,.7); padding: 5px 10px; border-radius: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
  #tutor { position: fixed; left: 12px; bottom: 44px; max-width: min(560px, calc(100vw - 300px)); background: rgba(8,36,64,.88); color: #fff; border-radius: 14px; padding: 10px 14px 12px; font-size: 16px; line-height: 1.35; }
  #tutor b { color: var(--chaleco); display: block; font-size: 12px; margin-bottom: 3px; letter-spacing: .04em; }
  #tareas { position: fixed; right: 12px; top: 60px; margin: 0; padding: 10px 14px 10px 30px; background: rgba(255,255,255,.9); color: var(--tinta); border-radius: 12px; font-size: 13px; max-width: 280px; }
  #tareas li { margin: 3px 0; } #tareas li.ok { color: #2e7d32; text-decoration: line-through; } #tareas li.actual { font-weight: bold; }
  #panel { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8,36,64,.35); z-index: 4; }
  #panel .caja { background: #fff; color: var(--tinta); border-radius: 18px; padding: 22px 24px; width: min(560px, calc(100vw - 32px)); box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  #panel h2 { margin: 0 0 10px; font-size: 22px; }
  #panel-texto { font-size: 15px; line-height: 1.45; white-space: pre-line; max-height: 50vh; overflow: auto; }
  #panel-botones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  #panel-botones button { background: var(--tinta); color: #fff; }
  @media (max-width: 640px) { #tareas { top: auto; bottom: 150px; font-size: 12px; max-width: 46vw; } #tutor { font-size: 13px; max-width: calc(100vw - 24px); } #ayuda { display: none; } }
</style>
</head>
<body>
<div id="cargando">Cargando la cabina del AT-802…</div>
<div id="barra"><b>AURAV · Cabina AT-802</b> <span id="fase"></span><span class="sep"></span><button id="voz" class="chico">Voz: sí</button><button id="menu" class="chico">Menú</button><button id="giro" class="chico" hidden>Mirar moviendo el celular</button><button id="ar" hidden>Modo cámara</button><button id="entorno" class="chico" hidden>Ver lugar real</button><button id="escala" class="chico" hidden>Escala 1:5</button><button id="vr" hidden>Entrar en VR</button></div>
<div id="ayuda">Arrastrá para mirar · flechas: bastón · A/D pedales · B frenos · F flaps · E largar carga · clic: switches y palancas · Esc: menú</div>
<div id="hud"></div>
<div id="tutor" hidden><b id="tutor-titulo"></b><span id="tutor-texto"></span></div>
<ul id="tareas" hidden></ul>
<div id="panel" hidden><div class="caja"><h2 id="panel-titulo"></h2><div id="panel-texto"></div><div id="panel-botones"></div></div></div>
<script>/* si el navegador guardó un index viejo, recargar con la versión publicada (GitHub Pages cachea 10 min) */
const VERSION_PAGINA = '20261026e';
fetch('./version.txt?' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(v => { v = v.trim(); if (v && v !== VERSION_PAGINA && !sessionStorage.getItem('recargado-' + v)) { sessionStorage.setItem('recargado-' + v, '1'); location.replace(location.pathname + '?v=' + v); } }).catch(() => {});
</script>
<script type="module" src="./main.js?v=20261026e"></script>
</body>
</html>
